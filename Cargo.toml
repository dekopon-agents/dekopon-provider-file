[workspace]

[package]
name = "dekopon-file-provider"
version = "0.3.1"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Bounded content-based file identification for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-file"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
dekopon-provider-sdk = "=0.36.0"
file-format = { version = "=0.29.0", default-features = false, features = ["reader-txt"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.36.0"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
