[workspace]

[package]
name = "dekopon-file-provider"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Bounded content-based file identification for Dekopon"
repository = "https://github.com/dekopon-agents/dekopon-provider-file"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = { version = "=0.18.0", features = ["clap"] }
file-format = { version = "=0.29.0", default-features = false, features = ["reader-txt"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
dekopon-provider-sdk-testkit = { version = "=0.18.0" }
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
